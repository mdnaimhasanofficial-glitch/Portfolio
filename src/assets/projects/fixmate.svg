      <stop offset="0" stop-color="#05070D"/>
      <stop offset="55%" stop-color="#0B1018"/>
      <stop offset="100%" stop-color="#140C06"/>
    </linearGradient>
    <linearGradient id="fmOrange" x1="0" y1="0" x2="1" y2="1">
