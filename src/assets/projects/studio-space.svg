<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="ssBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05070D"/>
      <stop offset="55%" stop-color="#0A101C"/>
      <stop offset="100%" stop-color="#0B0820"/>
    </linearGradient>
    <linearGradient id="ssAcc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="50%" stop-color="#4F8DFF"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="ssAccSoft" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.55"/>
    </linearGradient>
    <radialGradient id="ssGlowC" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ssGlowV" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <filter id="ssBlur"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>

  <!-- Base -->
  <rect width="1280" height="720" fill="url(#ssBg)"/>

  <!-- Ambient glows -->
  <ellipse cx="980" cy="150" rx="360" ry="260" fill="url(#ssGlowC)"/>
  <ellipse cx="250" cy="600" rx="340" ry="240" fill="url(#ssGlowV)"/>

  <!-- Grid -->
  <g stroke="#4F8DFF" stroke-opacity="0.08" stroke-width="1">
    <path d="M0 120 H1280 M0 240 H1280 M0 360 H1280 M0 480 H1280 M0 600 H1280"/>
    <path d="M160 0 V720 M320 0 V720 M480 0 V720 M640 0 V720 M800 0 V720 M960 0 V720 M1120 0 V720"/>
  </g>

  <!-- Studio calender / booking dashboard mock -->
  <g>
    <rect x="810" y="150" width="360" height="420" rx="20" fill="#0D1424" stroke="#34528F" stroke-opacity="0.5" stroke-width="2"/>
    <rect x="810" y="150" width="360" height="52" rx="20" fill="#0A0F1A"/>
    <rect x="810" y="182" width="360" height="20" fill="#0A0F1A"/>
    <circle cx="842" cy="176" r="7" fill="#F43F5E"/>
    <circle cx="866" cy="176" r="7" fill="#F59E0B"/>
    <circle cx="890" cy="176" r="7" fill="#10B981"/>
    <!-- calendar rows -->
    <g fill="#1B2440">
      <rect x="836" y="232" width="308" height="46" rx="10"/>
      <rect x="836" y="290" width="308" height="46" rx="10"/>
      <rect x="836" y="348" width="308" height="46" rx="10"/>
      <rect x="836" y="406" width="308" height="46" rx="10"/>
    </g>
    <!-- booking slots -->
    <rect x="848" y="244" width="120" height="22" rx="11" fill="url(#ssAcc)"/>
    <rect x="848" y="302" width="86" height="22" rx="11" fill="#22D3EE" fill-opacity="0.75"/>
    <rect x="848" y="360" width="150" height="22" rx="11" fill="#8B5CF6" fill-opacity="0.8"/>
    <rect x="848" y="418" width="104" height="22" rx="11" fill="#4F8DFF" fill-opacity="0.75"/>
    <text x="984" y="259" font-family="Inter, sans-serif" font-size="15" font-weight="600" fill="#8A97AD">2:00 PM</text>
    <text x="950" y="317" font-family="Inter, sans-serif" font-size="15" font-weight="600" fill="#8A97AD">11:00 AM</text>
    <text x="1014" y="375" font-family="Inter, sans-serif" font-size="15" font-weight="600" fill="#8A97AD">4:30 PM</text>
    <text x="968" y="433" font-family="Inter, sans-serif" font-size="15" font-weight="600" fill="#8A97AD">1:00 PM</text>
    <!-- book button -->
    <rect x="982" y="486" width="162" height="52" rx="14" fill="url(#ssAcc)"/>
    <text x="1008" y="519" font-family="Space Grotesk, Inter, sans-serif" font-size="20" font-weight="700" fill="#05070D">Book Slot</text>
  </g>

  <!-- Badge: full-stack -->
  <g>
    <rect x="90" y="150" width="420" height="88" rx="18" fill="#0D1424" stroke="#34528F" stroke-opacity="0.5" stroke-width="2"/>
    <rect x="112" y="172" width="52" height="44" rx="10" fill="#0A0F1A"/>
    <text x="124" y="204" font-family="Space Grotesk, sans-serif" font-size="26" font-weight="700" fill="#22D3EE">&lt;/&gt;</text>
    <text x="180" y="192" font-family="Space Grotesk, Inter, sans-serif" font-size="25" font-weight="700" fill="#EDF2FB">Full-Stack Platform</text>
    <text x="180" y="220" font-family="Inter, sans-serif" font-size="17" fill="#8A97AD">Next.js • Node.js • Express • MongoDB</text>
  </g>

  <!-- Wordmark -->
  <text x="90" y="380" font-family="Space Grotesk, Inter, sans-serif" font-size="104" font-weight="700" fill="#EDF2FB" letter-spacing="-2">Studio</text>
  <text x="470" y="380" font-family="Space Grotesk, Inter, sans-serif" font-size="104" font-weight="700" fill="url(#ssAcc)" letter-spacing="-2">Space</text>
  <text x="92" y="440" font-family="Inter, sans-serif" font-size="28" fill="#8A97AD">Studio booking, reimagined for the modern web.</text>

  <!-- Underline accent -->
  <rect x="92" y="470" width="330" height="6" rx="3" fill="url(#ssAccSoft)"/>

  <!-- Corner brackets -->
  <g stroke="url(#ssAcc)" stroke-width="4" fill="none" stroke-linecap="round">
    <path d="M28 60 V28 H60"/>
    <path d="M1220 660 V692 H1188"/>
  </g>
</svg>
