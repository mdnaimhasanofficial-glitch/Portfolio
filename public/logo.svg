<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="240" height="60" fill="none">
  <defs>
    <linearGradient id="logoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="logoAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
  </defs>

  <!-- Icon Container -->
  <g transform="translate(6, 6)">
    <rect width="48" height="48" rx="14" fill="url(#logoBg)" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.5"/>
    <!-- N Monogram -->
    <rect x="12" y="12" width="5" height="24" rx="2.5" fill="url(#logoAccent)"/>
    <path d="M14 13.5 L34 33 A 2.5 2.5 0 0 1 32 37 L12 17.5 A 2.5 2.5 0 0 1 14 13.5 Z" fill="url(#logoAccent)"/>
    <rect x="31" y="12" width="5" height="24" rx="2.5" fill="url(#logoAccent)"/>
    <!-- Active Green Indicator -->
    <circle cx="37" cy="11" r="3" fill="#10B981"/>
  </g>

  <!-- Typography: Naim.dev -->
  <text x="66" y="32" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="20" fill="#F8FAFC" letter-spacing="-0.5">
    Naim<tspan fill="#38BDF8">.dev</tspan>
  </text>
  
  <!-- Subtitle: MERN STACK DEVELOPER -->
  <text x="67" y="46" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="9" fill="#94A3B8" letter-spacing="1.2">
    MERN STACK INTERN
  </text>
</svg>
