<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>

    <!-- Vibrant Brand Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>

    <!-- Subtle Outer Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base Tile -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Subtle Inner Border Highlight -->
  <rect x="4" y="4" width="56" height="56" rx="14" fill="none" stroke="#F8FAFC" stroke-width="0.75" stroke-opacity="0.08"/>

  <!-- Stylized Tech Monogram "N" -->
  <g filter="url(#glow)">
    <!-- Left Stem -->
    <rect x="15" y="16" width="6.5" height="32" rx="3.25" fill="url(#accentGrad)"/>
    
    <!-- Diagonal Slash with crisp bevel -->
    <path d="M17.5 18 L46 44 A 3.25 3.25 0 0 1 43.5 49 L15 23 A 3.25 3.25 0 0 1 17.5 18 Z" fill="url(#accentGrad)" fill-opacity="0.95"/>
    
    <!-- Right Stem -->
    <rect x="42.5" y="16" width="6.5" height="32" rx="3.25" fill="url(#accentGrad)"/>
  </g>

  <!-- Glowing Active Status Dot (Emerald) -->
  <circle cx="49" cy="15" r="3.5" fill="#10B981"/>
  <circle cx="49" cy="15" r="5" fill="#10B981" fill-opacity="0.35"/>
</svg>